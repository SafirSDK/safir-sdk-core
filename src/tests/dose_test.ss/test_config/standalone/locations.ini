; $SAFIR_TEST_TEMP is set by whoever starts the run: the run_dose_tests.py
; script sets it if the caller has not already done so.
;
; In CI it is set to a directory inside the checkout, so that logs and
; crash dumps can be collected after the run.
; Otherwise it will be set to the same thing as @{TEMP} is resolved to by lluf_config
; (to /tmp on linux and %TEMP% or %TMP% on windows)
;
; IPC is set not to use $SAFIR_TEST_TEMP since that path is too long in CI,
; and IPC can't handle it.
;
lock_file_directory=$(SAFIR_TEST_TEMP)/safir-sdk-core/lock
crash_dump_directory=$(SAFIR_TEST_TEMP)/safir-sdk-core/crash_dumps
ipc_endpoints_directory=@{TEMP}/safir-sdk-core/ipc

