name: Set up build environment
description: >
  Installs the toolchains, Python venv and Conan cache that both the SDK build
  and the examples build need. The repo must already be checked out (and, in the
  Debian container, git/sudo/ca-certificates already bootstrapped) before this
  runs. Kept as a composite action so the build and build-examples jobs cannot
  drift apart. The doc and package-building toolchain is only installed when
  docs-and-packaging is "true" (the default); the examples build sets it to
  "false" since it merely compiles apps against an installed SDK.

inputs:
  platform:
    description: The matrix.platform value, used to key the Conan cache.
    required: true
  conan-home:
    description: CONAN_HOME path for this runner; also the Conan cache path.
    required: true
  conan-cache-prefix:
    description: >
      Cache key prefix. Independent jobs pass distinct prefixes so their caches
      (e.g. the SDK's Qt/Boost build vs. the examples' small Boost-1.79 set) do
      not collide.
    required: false
    default: conan-v2
  docs-and-packaging:
    description: >
      Whether to install the documentation toolchain (doxygen, graphviz, dia,
      dblatex, texlive, ghostscript, asciidoctor/asciidoctorj) and the
      package-building tools (devscripts/debhelper/fakeroot on Linux, NSIS on
      Windows). The SDK build needs them to render and ship docs and to build
      the .deb/.exe; the examples build only compiles apps against an installed
      SDK, so it passes "false" to skip them (notably the flaky asciidoctorj
      choco install).
    required: false
    default: "true"

outputs:
  cache-primary-key:
    description: >
      The exact Conan cache key this run restored against. The build/build-examples
      jobs feed it to actions/cache/save so they control WHEN the cache is written
      (e.g. skipping the save on tag/release builds) instead of letting the
      all-in-one cache action save unconditionally in its post step.
    value: ${{ steps.conan-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: "Verify D: drive exists (Windows)"
      # CI puts CONAN_HOME on D:\.conan2 because the C: drive is too small for
      # the from-scratch Boost/Qt builds. If the runner image ever drops the D:
      # "Temporary Storage" drive, fail loudly here instead of with a confusing
      # out-of-disk error mid-build.
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Test-Path 'D:\')) {
          Write-Error "D: drive not found. CI relies on it for CONAN_HOME ($env:CONAN_HOME) because C: is too small for the Boost/Qt builds. The runner image likely changed - revisit the conan_home matrix value in this workflow."
          exit 1
        }
        Write-Host "D: drive present; CONAN_HOME=$env:CONAN_HOME"

    - name: Install Linux prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        source "${GITHUB_ACTION_PATH}/../retry.sh"
        # Two hours rather than the 45 minute default: build gates the whole
        # matrix, so waiting here can save re-running everything downstream.
        # The build job's timeout-minutes is sized to stay above it - see the
        # invariant in retry.sh before changing either.
        export RETRY_BUDGET_SECONDS=7200
        # update and install are retried together, not separately: the failure
        # we hit was a 404 for a package version the index still advertised
        # after the mirror had moved on, and re-running install alone would ask
        # for the same missing filename forever. Only a fresh update fixes it.
        # Acquire::Retries covers transient archive fetches, but per Launchpad
        # #310262 it does not apply to the index files, hence both.
        #
        # The compilers, CMake/Ninja, JDK, Boost/unixODBC and Qt that both the
        # SDK build and the examples build need. python3-apt backs run_test.py's
        # DebianInstaller (it calls apt.cache.Cache() to decide whether the SDK
        # is already installed); the examples build crashes without it.
        # mono-devel supplies the C# compiler (mcs); without it FindCSharp sets
        # CSHARP_FOUND=false and the C# example apps are silently skipped.
        # apt-get update fails the whole command if ANY configured repo is
        # unreachable, including ones we never install from. The GitHub Ubuntu
        # runner image ships azure-cli and microsoft-prod source lists, and on
        # 2026-08-28 packages.microsoft.com served 403 Forbidden for both for
        # about an hour, which is all it took to lose a dose leg (run
        # 33176126427) to an outage in software this repo does not use. Drop
        # them by content rather than by filename, since the image renames them
        # from time to time. Failures here are ignored: not finding anything to
        # remove is the normal case.
        sudo find /etc/apt/sources.list.d -type f \
             -exec grep -lF packages.microsoft.com {} + 2>/dev/null \
          | xargs -r sudo rm -f || true

        install_linux_prerequisites() {
          sudo apt-get update -qq &&
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            python3 python3-venv python3-pip pipx python-is-python3 python3-distro python3-apt \
            build-essential g++ cmake \
            default-jdk mono-devel \
            libboost-all-dev unixodbc-dev \
            qt6-base-dev qt6-websockets-dev qt6-base-private-dev qt6-svg-dev \
            ninja-build python3-websocket
        }
        retry "Linux prerequisites" install_linux_prerequisites

    - name: Install Linux documentation and packaging tools
      if: runner.os == 'Linux' && inputs.docs-and-packaging == 'true'
      shell: bash
      run: |
        source "${GITHUB_ACTION_PATH}/../retry.sh"
        # Two hours rather than the 45 minute default: build gates the whole
        # matrix, so waiting here can save re-running everything downstream.
        # The build job's timeout-minutes is sized to stay above it - see the
        # invariant in retry.sh before changing either.
        export RETRY_BUDGET_SECONDS=7200
        # Only the SDK build renders the shipped docs and builds the .deb; the
        # examples build needs none of this.
        # lintian is only a 'recommends' of devscripts, so --no-install-recommends
        # drops it; without it debuild silently skips the lintian check that the
        # warnings-summary job collects (and that Jenkins ran). List it explicitly.
        install_linux_docs_tools() {
          sudo apt-get update -qq &&
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            doxygen graphviz \
            dia dblatex texlive-font-utils ghostscript \
            devscripts debhelper fakeroot lintian \
            asciidoctor cli-common-dev
        }
        retry "Linux documentation and packaging tools" install_linux_docs_tools

    - name: Install Windows prerequisites
      if: runner.os == 'Windows' && inputs.docs-and-packaging == 'true'
      shell: bash
      run: |
        source "${GITHUB_ACTION_PATH}/../retry.sh"
        # Two hours rather than the 45 minute default: build gates the whole
        # matrix, so waiting here can save re-running everything downstream.
        # The build job's timeout-minutes is sized to stay above it - see the
        # invariant in retry.sh before changing either.
        export RETRY_BUDGET_SECONDS=7200
        # doxygen/graphviz/asciidoctorj/dia render the documentation that the
        # Windows packages must ship (see BUILD.Windows.txt); without them the
        # build silently skips docs. dejavufonts backs the doc generation too -
        # dia rasterises the users guide diagrams to PNG at build time
        # (docs/users_guide/CMakeLists.txt), so the fonts have to be on the
        # machine, they are not just a stylesheet fallback. asciidoctorj is the
        # JVM asciidoctor and needs Java at build time - the "Set up Java
        # (Windows)" step below puts it on PATH before the build.
        #
        # Every package is retried SEPARATELY, one choco invocation each. That
        # costs a few seconds of choco startup per package and is worth it,
        # because retry granularity has to match failure granularity. These
        # fetch from third parties that fail independently: doxygen.install and
        # dia download installers from sourceforge, which has both hung until
        # chocolatey's 2700s timeout and returned an immediate EOF, and
        # asciidoctorj fetches its zip from search.maven.org, which rate-limits
        # with 403 for long stretches. choco has no built-in download retry
        # (chocolatey/choco#385, #1853), so this wrapper is the only thing
        # standing between us and a red run.
        #
        # From the second attempt on we add -f, because choco can leave a failed
        # package looking installed and then skip it on the next try
        # (chocolatey/choco#1027). Not on the first attempt: forcing a reinstall
        # of something that is already fine just means downloading it again.
        #
        # Installing them as one batch is what broke run 33111295598, and the
        # failure is worth remembering because retrying caused it. sourceforge
        # 404'd doxygen.install on attempt 1, so attempt 2 re-ran the WHOLE
        # batch with -f, which forced a reinstall of dejavufonts - a package
        # that had just installed fine seconds earlier. Its install script ends
        # in a Shell.Application CopyHere into the Fonts folder with no flags,
        # and with the fonts now already present that raises an overwrite
        # confirmation dialog. On a runner there is no desktop to answer it, so
        # it hung for choco's full 2700s, every attempt, until the job hit the
        # six hour limit and every downstream test job was skipped. Per-package
        # retries mean -f only ever re-forces the package that actually failed.
        force_on_retry() { [ "${RETRY_ATTEMPT:-1}" -gt 1 ] && echo "-f"; }

        # --execution-timeout well below choco's 2700s default, so a hung
        # install costs minutes rather than three quarters of an hour. The whole
        # batch installs in about 75s when nothing is wrong, so this is roughly
        # an order of magnitude of headroom for the slowest single package.
        install_choco_package() {
          choco install "$1" --no-progress -y --execution-timeout 600 $(force_on_retry)
        }

        for package in nsis doxygen.install graphviz dia dejavufonts gzip asciidoctorj; do
          retry "chocolatey package ${package}" install_choco_package "${package}"
        done
        # choco installs NSIS but does not put it on PATH. windows-2022 shipped
        # NSIS on PATH already; windows-2025-vs2026 does not, so makensis was not
        # found during packaging. Add it explicitly for the later build step.
        echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

    - name: Set up Java (Windows)
      if: runner.os == 'Windows'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Python venv
      shell: bash
      run: | # zizmor: ignore[github-env]
        python -m venv --system-site-packages .venv
        # The values written to GITHUB_ENV/GITHUB_PATH below are static
        # (GITHUB_WORKSPACE + literal .venv paths), not attacker-derived, so there
        # is no injection vector. This is the documented way to put the venv on
        # PATH and point CMake's find_package(Python3) at it across later steps.
        # Export VIRTUAL_ENV (not just PATH) so CMake's find_package(Python3)
        # selects the venv interpreter. Without it, FindPython3 on Windows
        # prefers the registry/system Python and the ctest scripts run with an
        # interpreter that lacks our pip requirements (e.g. websockets).
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> $GITHUB_PATH
        else
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
        fi

    - name: Install Python requirements
      shell: bash
      run: |
        source "${GITHUB_ACTION_PATH}/../retry.sh"
        # Two hours rather than the 45 minute default: build gates the whole
        # matrix, so waiting here can save re-running everything downstream.
        # The build job's timeout-minutes is sized to stay above it - see the
        # invariant in retry.sh before changing either.
        export RETRY_BUDGET_SECONDS=7200
        install_python_requirements() {
          python -m pip install --upgrade pip &&
          pip install -r build/requirements.txt
        }
        retry "Python requirements" install_python_requirements

    - name: Restore Conan packages
      # Restore only. The matching save is done by the calling job after the
      # build+trim, so it can decide whether to write the cache at all (tag/
      # release builds skip the save to avoid churning the shared cache with a
      # one-off release build). cache-primary-key is exposed as an output above.
      id: conan-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.conan-home }}
        key: ${{ inputs.conan-cache-prefix }}-${{ inputs.platform }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'build/requirements.txt') }}
        restore-keys: |
          ${{ inputs.conan-cache-prefix }}-${{ inputs.platform }}-${{ runner.arch }}-

    - name: Trim Conan cache after restore
      # The restored cache may carry each dependency's source/build/download
      # folders (~/.conan2/p/b/<ref>/{s,b,d}) alongside the package binary (p/).
      # Those are huge for source-built Boost/Qt and only waste runner disk
      # during the build. Drop them now so the build has room. Safe: conan
      # consumes the cached package binaries without these folders.
      shell: bash
      run: conan cache clean "*" || true
