name: Set up test environment
description: >
  Installs only what the dose test jobs need to install a prebuilt package and
  run the test suite: a Python venv with the repo requirements and a Java
  runtime for the Java test partners. Deliberately leaner than
  setup-build-env - no compilers, Qt/Boost -dev packages, doc toolchain
  (doxygen/dia/texlive/asciidoctorj) or Conan cache, none of which a
  test-only job needs. The package's own runtime dependencies are pulled in by
  apt when run_test.py installs the .deb, so they are not listed here.

runs:
  using: composite
  steps:
    - name: Install Linux prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        source "${GITHUB_ACTION_PATH}/../retry.sh"
        # Only the Python harness tooling that runs run_test.py/run_dose_tests
        # itself goes here; the SDK's own runtime needs (Boost/Qt, plus the JRE
        # and Mono for the Java/.NET test partners) are declared as package
        # dependencies and pulled in by apt when run_test.py installs the .deb.
        # python3-apt backs run_test.py's DebianInstaller (it calls
        # apt.cache.Cache() to decide whether the SDK is already installed) and
        # python3-websocket backs the websocket tests.
        #
        # update and install are retried as one unit: the failure this guards
        # against is a 404 for a version the index still advertises after the
        # mirror moved on, and only a fresh update fixes that.
        # apt-get update fails the whole command if ANY configured repo is
        # unreachable, including ones we never install from. The GitHub Ubuntu
        # runner image ships azure-cli and microsoft-prod source lists, and on
        # 2026-08-28 packages.microsoft.com served 403 Forbidden for both for
        # about an hour, which is all it took to lose a dose leg (run
        # 33176126427) to an outage in software this repo does not use. Drop
        # them by content rather than by filename, since the image renames them
        # from time to time. Failures here are ignored: not finding anything to
        # remove is the normal case.
        sudo find /etc/apt/sources.list.d -type f \
             -exec grep -lF packages.microsoft.com {} + 2>/dev/null \
          | xargs -r sudo rm -f || true

        install_test_prerequisites() {
          sudo apt-get update -qq &&
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            python3 python3-venv python3-pip python-is-python3 python3-distro python3-apt \
            python3-websocket
        }
        retry "Linux test prerequisites" install_test_prerequisites

    - name: Set up Java (Windows)
      if: runner.os == 'Windows'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Python venv
      shell: bash
      run: | # zizmor: ignore[github-env]
        python -m venv --system-site-packages .venv
        # The values written to GITHUB_ENV/GITHUB_PATH below are static
        # (GITHUB_WORKSPACE + literal .venv paths), not attacker-derived, so there
        # is no injection vector. This is the documented way to put the venv on
        # PATH and point CMake's find_package(Python3) at it across later steps.
        # Export VIRTUAL_ENV (not just PATH) so CMake's find_package(Python3)
        # selects the venv interpreter. Without it, FindPython3 on Windows
        # prefers the registry/system Python and the ctest scripts run with an
        # interpreter that lacks our pip requirements (e.g. websockets).
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> $GITHUB_PATH
        else
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
        fi

    - name: Install Python requirements
      shell: bash
      run: |
        source "${GITHUB_ACTION_PATH}/../retry.sh"
        install_python_requirements() {
          python -m pip install --upgrade pip &&
          pip install -r build/requirements.txt
        }
        retry "Python requirements" install_python_requirements
