name: CI

on:
  push:
    branches: [master, develop, 'feature/**', 'private/**']
    # Version tags (e.g. 7.4.3 or 7.4.3-alpha1) trigger a full build and, via the
    # release job below, publish the installers/.deb zips on a GitHub release.
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:

# Serialize CI per branch/ref: only one run per branch executes at a time, and a
# new push waits for the in-progress run to finish instead of cancelling it.
# These builds are expensive, and not cancelling preserves the Conan/build cache
# reuse within a branch. If several commits stack up while a run is in progress,
# only the newest stays queued - the older still-pending run is superseded (so
# we skip intermediate commits rather than building every one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Multicomputer overlay address plan (10.68.x.y so the existing 1*.*68.*.* .dou
  # bind pattern matches with NO config change). Each master/slaves pair is an
  # isolated point-to-point tunnel, so all four pairs reuse the same addresses
  # without colliding. Consumed only by the multicomputer-master/-slaves jobs; the
  # master needs just its own + the seed's address, the rest live on the slaves runner.
  MASTER_ADDR: "10.68.1.1"
  SERVER_1_ADDR: "10.68.0.2"   # seed (core-multicomputer-test-server-1-slave)
  CLIENT_0_ADDR: "10.68.0.3"
  CLIENT_1_ADDR: "10.68.0.4"
  SLAVE_SUBNET: "10.68.0.0/24"

# Default the whole workflow to read-only. The only job that needs more is
# test-summary, which grants itself checks: write (to publish the aggregated
# Check run) and pull-requests: write (its PR comment) in its own job-level
# permissions block; release likewise grants its own contents: write.
permissions:
  contents: read

jobs:
  # Static security analysis of the workflow/action files themselves (zizmor).
  # Catches over-broad token permissions, unpinned third-party actions,
  # template-injection and credential-persistence issues before they merge.
  # Fast and dependency-light, so it runs as its own up-front job rather than
  # gating the build matrix; deliberate exceptions are recorded as inline
  # `# zizmor: ignore[...]` comments and in .github/zizmor.yml.
  workflow-lint:
    name: Workflow security lint (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run zizmor
        # GH_TOKEN lets zizmor's online audits resolve action refs via the GitHub
        # API without hitting the anonymous rate limit. Pinned version so a new
        # zizmor release can't turn the job red without a deliberate bump.
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.26.1 .github/

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    # Most rows run directly on the host runner. The Debian row sets
    # matrix.container to a Debian image so the build runs against Debian's real
    # toolchain/libs; an empty image here means "no container" (run on host).
    # GitHub has no Debian-labelled runner, so a container on ubuntu-latest is
    # the only way to get a genuine Debian build. The object form is needed so we
    # can pass --shm-size: Docker defaults /dev/shm to 64 MB, but dose_main
    # creates a 100 MB managed_shared_memory there and quick_exit(1)s if it can't,
    # which fails every test that starts the DOB.
    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options }}

    # Keep the Conan cache (and thus the from-scratch Boost/Qt builds) off the
    # cramped Windows C: drive. The hosted Windows runners only have ~32-85 GB
    # free on C: but a near-empty 147 GB D: "Temporary Storage" drive, where the
    # workspace already lives. Linux keeps the default ~/.conan2.
    env:
      CONAN_HOME: ${{ matrix.conan_home }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-noble
            arch: amd64
            runner: ubuntu-24.04
            conan_home: /home/runner/.conan2

          # Native arm64 build on GitHub's hosted Arm runner. The Linux build
          # steps are arch-agnostic (keyed on runner.os), so no other changes are
          # needed; the Conan cache key already includes runner.arch so amd64 and
          # arm64 caches stay separate.
          - platform: ubuntu-noble
            arch: arm64
            runner: ubuntu-24.04-arm
            conan_home: /home/runner/.conan2

          # No Debian runner exists, so build inside a Debian container on the
          # ubuntu-latest host. Runs as root (the container's default user):
          # writes to $GITHUB_ENV/$GITHUB_PATH and the mounted workspace all work
          # without UID juggling, and root-owned files are correct for a system
          # .deb anyway (lintian's root-owner warnings are cosmetic). CONAN_HOME
          # is /root/.conan2 because there is no /home/runner inside the container.
          - platform: debian-trixie
            arch: amd64
            runner: ubuntu-latest
            container: debian:13
            container_options: --shm-size=200m
            conan_home: /root/.conan2

          - platform: vs2022
            arch: amd64
            runner: windows-2022
            studio: vs2022
            conan_home: 'D:\.conan2'

          - platform: vs2026
            arch: amd64
            runner: windows-2025-vs2026
            studio: vs2026
            conan_home: 'D:\.conan2'

    steps:
      - name: Bootstrap Debian container
        # The debian:13 image is bare: no git (actions/checkout needs it to
        # produce a real working tree, otherwise build scripts that call git
        # break), no sudo (the shared "Install Linux prerequisites" step calls
        # sudo apt-get), and no ca-certificates (https apt/pip would fail). Run
        # this before checkout so the repo is cloned with git. Skipped on
        # non-container rows where matrix.container is empty.
        if: ${{ matrix.container != '' }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo ca-certificates git
          # The workspace is mounted owned by the host runner UID (1001) but we
          # run as root, so git refuses with "dubious ownership". checkout works
          # around this for itself, but build.py's own git calls would still
          # fail; mark all repos safe globally for root.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Toolchains, Python venv and Conan cache. Shared with the build-examples
      # job via a composite action so the two setups cannot drift apart.
      - name: Set up build environment
        id: setup-build-env
        uses: ./.github/actions/setup-build-env
        with:
          platform: ${{ matrix.platform }}
          conan-home: ${{ matrix.conan_home }}

      - name: Check source tree
        run: python build/check_source_tree.py

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: python build/build.py --jenkins

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: cmd # zizmor: ignore[misfeature] - cmd is intentional here (invokes build.py the same way the Windows build does); the tip only notes cmd limits static analysis
        run: python build\build.py --jenkins --use-studio ${{ matrix.studio }} --arch amd64

      - name: Trim and save Conan cache
        if: always()
        uses: ./.github/actions/save-conan-cache
        with:
          conan-home: ${{ matrix.conan_home }}
          cache-key: ${{ steps.setup-build-env.outputs.cache-primary-key }}

      - name: Upload packages
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            tmp/*.deb
            build/packaging/windows/*.exe
          if-no-files-found: ignore

      - name: Upload build log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: buildlog-${{ matrix.platform }}-${{ matrix.arch }}
          path: buildlog.html
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: '**/*.junit.xml'
          if-no-files-found: ignore

  # Render the shipped documentation (User's Guide + Requirements Specification,
  # HTML + PDF) the way Jenkins' "Render documentation" stage does. This is a
  # standalone docs build: docs/CMakeLists.txt only builds the asciidoctor
  # documents when there is no parent project, so it needs just the doc toolchain
  # (asciidoctor/dia/dblatex/texlive/ghostscript) plus cmake/ninja - no compilers,
  # Qt, Boost or Conan. The output (HTML/PDF) is distro-independent, so it runs
  # straight on ubuntu-latest rather than in a debian container. No `needs`: it is
  # independent of the build artifacts and runs in parallel, as its own stage does
  # in Jenkins.
  render-docs:
    name: Render documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install documentation toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            asciidoctor dia dblatex texlive-font-utils ghostscript

      - name: Render documentation
        # Mirrors Jenkins render_documentation(): standalone in-source docs build.
        # Tee to buildlog.txt so the warnings-summary job can scan the doxygen and
        # cmake output for warnings.
        run: |
          set -euo pipefail
          rm -rf rendered_docs
          cd docs
          { cmake . -G Ninja && ninja && ninja install; } 2>&1 | tee ../buildlog.txt
          mv rendered_docs ..

      - name: Verify expected documents were produced
        # docs/CMakeLists.txt SILENTLY skips rendering (message STATUS + return)
        # if the asciidoctor/dblatex toolchain is missing, so a toolchain
        # regression would otherwise upload partial docs and pass green. Fail loud.
        run: |
          set -euo pipefail
          missing=0
          for f in \
            rendered_docs/users_guide.html \
            rendered_docs/users_guide.pdf \
            rendered_docs/requirements_specification.html \
            rendered_docs/requirements_specification.pdf; do
            if [ ! -s "$f" ]; then
              echo "MISSING or empty: $f"; missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Documentation render produced incomplete output - the doc toolchain likely regressed."
            exit 1
          fi
          ls -la rendered_docs

      - name: Upload rendered documentation
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rendered-docs
          path: rendered_docs
          if-no-files-found: ignore

      - name: Upload build log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: buildlog-docs
          path: buildlog.txt
          if-no-files-found: ignore

  # Build the example apps against the SDK package the build job produced. This
  # mirrors the Jenkins "Build examples" stage: it installs the package
  # system-wide and uses dobmake-batch (via run_test.py) to compile the example
  # apps on top of the installed SDK - the real-world check that a user can build
  # against an installed Safir SDK Core. On Windows that includes Debug apps,
  # where the MSVC per-config runtime split matters.
  build-examples:
    name: examples-${{ matrix.platform }}-${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}

    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options }}

    env:
      CONAN_HOME: ${{ matrix.conan_home }}
      # examples/CMakeLists.txt switches VehicleAppCpp to an old Conan Boost 1.79
      # when JENKINS_HOME is set, exactly like the Jenkins examples build - this
      # verifies the SDK works against a user-chosen Boost. run_test.py itself
      # does not read this variable, so it has no other effect.
      JENKINS_HOME: "1"
      # run_test.py's build_examples() forwards these to dobmake-batch on Windows
      # (--use-studio / --arch). PACKAGE_TYPE is left unset and defaults to Full,
      # so the examples are built in Debug + Release + RelWithDebInfo.
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_ARCH: ${{ matrix.arch }}

    # Same matrix as the build job (kept in sync by hand); each row consumes the
    # package artifact uploaded by its build-job counterpart.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-noble
            arch: amd64
            runner: ubuntu-24.04
            conan_home: /home/runner/.conan2

          # Native arm64 build on GitHub's hosted Arm runner, matching the build
          # job. The examples build is arch-agnostic (keyed on runner.os) and the
          # Conan cache key includes runner.arch, so amd64 and arm64 stay separate.
          - platform: ubuntu-noble
            arch: arm64
            runner: ubuntu-24.04-arm
            conan_home: /home/runner/.conan2

          - platform: debian-trixie
            arch: amd64
            runner: ubuntu-latest
            container: debian:13
            container_options: --shm-size=200m
            conan_home: /root/.conan2

          - platform: vs2022
            arch: amd64
            runner: windows-2022
            studio: vs2022
            conan_home: 'D:\.conan2'

          - platform: vs2026
            arch: amd64
            runner: windows-2025-vs2026
            studio: vs2026
            conan_home: 'D:\.conan2'

    steps:
      - name: Bootstrap Debian container
        # Same as the build job: the bare debian:13 image needs git/sudo/ca-certs
        # before checkout and before the shared setup runs sudo apt-get.
        if: ${{ matrix.container != '' }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo ca-certificates git
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up build environment
        id: setup-build-env
        uses: ./.github/actions/setup-build-env
        with:
          platform: ${{ matrix.platform }}
          conan-home: ${{ matrix.conan_home }}
          # Separate cache from the SDK build: the examples only pull a small
          # Boost 1.79, so they must not share (or evict) the SDK's Qt/Boost cache.
          conan-cache-prefix: conan-examples-v1
          # The examples build only compiles apps against the installed SDK; it
          # never renders docs or builds packages, so skip that toolchain (and
          # the flaky asciidoctorj choco install) entirely.
          docs-and-packaging: "false"

      - name: Download SDK package
        # v8 runs on Node 24; the v6 tag still bundles Node 20, which GitHub is
        # deprecating. v8 reads artifacts produced by upload-artifact v4+, so it
        # is compatible with the v6 upload step in the build job.
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: package-download

      - name: Stage installer at repo root
        uses: ./.github/actions/stage-installer

      # Tee the build output to buildlog.txt so the warnings-summary job can scan
      # the examples compile for warnings (dobmake-batch runs --verbose, so all
      # compiler output reaches stdout). bash works on every runner (incl. the
      # debian container and Windows) and python takes forward-slash paths; the
      # original cmd shell had no tee. pipefail ties the exit code to run_test.py.
      - name: Build examples
        shell: bash
        run: |
          set -o pipefail
          python build/jenkins_stuff/run_test.py --test build-examples 2>&1 | tee buildlog.txt

      - name: Trim and save Conan cache
        if: always()
        uses: ./.github/actions/save-conan-cache
        with:
          conan-home: ${{ matrix.conan_home }}
          cache-key: ${{ steps.setup-build-env.outputs.cache-primary-key }}

      - name: Upload build log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: buildlog-examples-${{ matrix.platform }}-${{ matrix.arch }}
          path: buildlog.txt
          if-no-files-found: ignore

  # Run the big dose test suite (243 testcases) against the installed SDK package,
  # in both the "standalone" (one node) and "multinode" (four nodes, all on this
  # one machine) configurations. This mirrors the Jenkins "Test suite" stage. The
  # flow matches build-examples: install the testsuite package via run_test.py,
  # which then drives run_dose_tests with the partner languages from $LANGUAGES.
  # The multicomputer config is intentionally NOT run here - it needs separate
  # slave *machines* (Jenkins agents), which hosted GitHub runners can't provide.
  dose-tests:
    name: ${{ matrix.kind }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.languages }}
    needs: build
    runs-on: ${{ matrix.runner }}
    # A dose run that hangs (e.g. a partner that never connects) would otherwise
    # sit until the 6-hour default. The timing data the old 30 min asked for
    # arrived on CI #150: multinode ubuntu-noble-arm64 runs 27 min every time,
    # so 30 left 9% of headroom, and two of its three language combos were
    # killed at testcase 9999 - the last one in the suite - having done all the
    # work and reported none of it. 60 is ~2.2x the observed runtime, matching
    # how the slow-suite driver timeout was picked (1800s against ~550s). A
    # timeout only has to be tight enough to beat the 6-hour default: a genuine
    # hang does not finish in 45 minutes either, so buying margin costs nothing.
    timeout-minutes: 60

    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options }}

    env:
      # run_test.py passes --jenkins to run_dose_tests, which then reads the
      # partner-language assignment from $LANGUAGES (5 dash-separated languages,
      # one per partner). This is what makes each matrix row a distinct
      # cross-language interop run.
      LANGUAGES: ${{ matrix.languages }}
      # run_dose_tests --jenkins puts its temp area (lock files, crash dumps) at
      # $WORKSPACE/temp; on Jenkins WORKSPACE is the build workspace. github.workspace
      # is the GHA equivalent, so reuse it. Safir creates the subdirs itself.
      WORKSPACE: ${{ github.workspace }}
      # run_test.py's run_test_suite() reads $JOB_NAME to detect 32-bit-on-64
      # ("32on64") Jenkins jobs and drop the Java partner. We are never that, so
      # any value without "32on64" both satisfies the lookup (it would KeyError if
      # unset) and keeps all partners enabled.
      JOB_NAME: ${{ github.workflow }}-${{ matrix.kind }}

    # kind x languages x platform = 2 x 3 x 5 = 30 jobs. kind/languages/platform
    # are real cross-product axes; the include entries only attach the coupled
    # per-platform settings (runner, container, conan_home) to each platform token,
    # so the five build rows stay defined in one place instead of 30 duplicates.
    strategy:
      fail-fast: false
      matrix:
        kind: [standalone, multinode]
        languages:
          - dotnet-java-cpp-dotnet-java
          - java-cpp-dotnet-java-cpp
          - cpp-cpp-cpp-cpp-cpp
        platform: [ubuntu-noble-amd64, ubuntu-noble-arm64, debian-trixie-amd64, vs2022, vs2026]
        include:
          - platform: ubuntu-noble-amd64
            platform_name: ubuntu-noble
            arch: amd64
            runner: ubuntu-24.04
          - platform: ubuntu-noble-arm64
            platform_name: ubuntu-noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: debian-trixie-amd64
            platform_name: debian-trixie
            arch: amd64
            runner: ubuntu-latest
            container: debian:13
            # The multinode tests run four safir_control nodes at once, each
            # with its own shared memory in /dev/shm: ~100 MB Dob distribution
            # (SharedMemorySize) + 10 MB typesystem per node, so ~440 MB total.
            # 200m fits a single node (standalone passes) but not four, so the
            # extra nodes fail to map their shared memory, the system never
            # forms and the sequencer hangs until the timeout. Native runners
            # have a large /dev/shm; give the container comparable headroom
            # (tmpfs only consumes what is actually used).
            container_options: --shm-size=2g
          - platform: vs2022
            platform_name: vs2022
            arch: amd64
            runner: windows-2022
          - platform: vs2026
            platform_name: vs2026
            arch: amd64
            runner: windows-2025-vs2026

    steps:
      - name: Bootstrap Debian container
        # Same as the build job: the bare debian:13 image needs git/sudo/ca-certs
        # before checkout and before the shared setup runs sudo apt-get.
        if: ${{ matrix.container != '' }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo ca-certificates git
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up test environment
        # The dose tests only install a prebuilt package and run it; they never
        # compile or invoke Conan. setup-test-env installs just the Python venv
        # and a JRE, skipping the compilers, Qt/Boost -dev packages, doc
        # toolchain and Conan cache that setup-build-env carries.
        uses: ./.github/actions/setup-test-env

      - name: Download SDK package
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.platform_name }}-${{ matrix.arch }}
          path: package-download

      - name: Stage installer at repo root
        uses: ./.github/actions/stage-installer

      - name: Run dose tests (Linux)
        if: runner.os == 'Linux'
        run: python build/jenkins_stuff/run_test.py --test ${{ matrix.kind }}-tests

      - name: Run dose tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd # zizmor: ignore[misfeature] - cmd is intentional here (invokes build.py the same way the Windows build does); the tip only notes cmd limits static analysis
        run: python build\jenkins_stuff\run_test.py --test ${{ matrix.kind }}-tests

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dose-results-${{ matrix.kind }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.languages }}
          path: '**/*.junit.xml'
          if-no-files-found: ignore

  # Run the slow, system-level test suite (system picture, incarnation/control,
  # light/restart nodes, lowmem, DOPE none/file backends, tracer backdoor,
  # election handler, communication) against the installed SDK package. These
  # were moved out of ctest into the TestSuite component; the flow matches
  # dose-tests - install the testsuite package via run_test.py, which then drives
  # run_slow_tests. The odbc DOPE backend is not included (it needs a database; it
  # runs under --test database). Runs on the same platform matrix as dose-tests
  # now that the suite has proven stable on ubuntu-noble amd64.
  slow-tests:
    name: slow-tests-${{ matrix.platform }}-${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    # The suite is long: system_picture alone is ~40 min, and a known-flaky
    # light-node subtest can burn a 10 min timeout. Give generous headroom over an
    # observed healthy run; revisit once we have more timing data.
    timeout-minutes: 150

    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-noble-amd64, ubuntu-noble-arm64, debian-trixie-amd64, vs2022, vs2026]
        include:
          - platform: ubuntu-noble-amd64
            platform_name: ubuntu-noble
            arch: amd64
            runner: ubuntu-24.04
          - platform: ubuntu-noble-arm64
            platform_name: ubuntu-noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: debian-trixie-amd64
            platform_name: debian-trixie
            arch: amd64
            runner: ubuntu-latest
            container: debian:13
            # The light/restart-node tests run several safir_control nodes at
            # once, each mapping its own shared memory in /dev/shm (~100 MB Dob
            # distribution + 10 MB typesystem per node). The default 64 MB is far
            # too small, so the extra nodes fail to map their shared memory and
            # the system never forms. Native runners have a large /dev/shm; give
            # the container comparable headroom (tmpfs only uses what it needs).
            container_options: --shm-size=2g
          - platform: vs2022
            platform_name: vs2022
            arch: amd64
            runner: windows-2022
          - platform: vs2026
            platform_name: vs2026
            arch: amd64
            runner: windows-2025-vs2026

    steps:
      - name: Bootstrap Debian container
        # Same as the build/dose-tests jobs: the bare debian:13 image needs
        # git/sudo/ca-certs before checkout and before the shared setup runs sudo
        # apt-get.
        if: ${{ matrix.container != '' }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo ca-certificates git
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up test environment
        # Same lean test-only setup as dose-tests: a Python venv (with websockets,
        # which run_tracer_backdoor_tests needs) and a JRE. The SDK's own runtime
        # deps come in via apt when run_test.py installs the .deb.
        uses: ./.github/actions/setup-test-env

      - name: Download SDK package
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.platform_name }}-${{ matrix.arch }}
          path: package-download

      - name: Stage installer at repo root
        uses: ./.github/actions/stage-installer

      - name: Run slow tests (Linux)
        if: runner.os == 'Linux'
        run: python build/jenkins_stuff/run_test.py --test slow-tests

      - name: Run slow tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd # zizmor: ignore[misfeature] - cmd is intentional here (invokes build.py the same way the Windows build does); the tip only notes cmd limits static analysis
        run: python build\jenkins_stuff\run_test.py --test slow-tests

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: slow-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: '**/*.junit.xml'
          if-no-files-found: ignore

  # Multicomputer dose tests = the node under test (Server_0, the "master") on one
  # runner talking to three debian slave nodes (Server_1 seed + Client_0 + Client_1)
  # on another, joined by an accountless/secretless WireGuard overlay punched between
  # the two runners (only the built-in GITHUB_TOKEN, see .github/actions/wireguard-overlay).
  # master and slaves run as a matched PAIR per platform: they share the upstream
  # `needs` but do NOT depend on each other (they start concurrently to punch the live
  # tunnel). The WireGuard rendezvous artifacts are namespaced per matrix platform
  # (master-<platform>/slaves-<platform>) so the four concurrent pairs never cross-wire.
  #
  # Only the four host-NATIVE platforms can be a master: the wireguard-overlay action
  # manipulates host networking, so the master can't run in a job container, and
  # debian-trixie has no host-native runner (it only exists as a debian:13 container).
  # debian is still exercised here - it is the platform all three SLAVE nodes run on.
  #
  # `needs: [build, dose-tests]` defers the start until the build packages exist AND
  # the standalone/multinode matrix has finished, which staggers the runner budget
  # (this is the last wave). The `if` lets them still run when a dose-tests row fails
  # (multicomputer only really needs the packages from build), but not when build
  # itself failed or the run was cancelled.
  multicomputer-master:
    name: multicomputer-master-${{ matrix.platform }}
    needs: [build, dose-tests]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    # The suite itself takes ~20 min; the rest is headroom for the overlay
    # rendezvous, which waits out however long the paired job sits in the runner
    # queue (wireguard-overlay's peer-wait-minutes). The old 30 was too tight
    # even when nothing went wrong - a healthy run has been observed using 27 of
    # it - and left no room at all for scheduling skew.
    timeout-minutes: 55
    permissions:
      contents: read
      # The overlay rendezvous reads this run's artifacts and jobs via the REST
      # API. A job-level block replaces the workflow default, so contents is
      # re-granted here for actions/checkout.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-noble-amd64
            platform_name: ubuntu-noble
            arch: amd64
            runner: ubuntu-24.04
          - platform: ubuntu-noble-arm64
            platform_name: ubuntu-noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: vs2022
            platform_name: vs2022
            arch: amd64
            runner: windows-2022
          - platform: vs2026
            platform_name: vs2026
            arch: amd64
            runner: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up test environment
        uses: ./.github/actions/setup-test-env

      - name: Download SDK package (master platform)
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.platform_name }}-${{ matrix.arch }}
          path: package-download

      - name: Stage installer at repo root
        uses: ./.github/actions/stage-installer

      - name: Establish WireGuard overlay (Server_0 side)
        uses: ./.github/actions/wireguard-overlay
        with:
          my-role: master-${{ matrix.platform }}
          peer-role: slaves-${{ matrix.platform }}
          wg-address: ${{ env.MASTER_ADDR }}/32
          # /16 covers both the slave container /24 AND the slaves wg transit /32
          # (10.68.1.2), which we punch/verify against before the containers exist.
          peer-allowed-ips: 10.68.0.0/16
          verify-peer-ip: 10.68.1.2
          github-token: ${{ github.token }}
          # Must match multicomputer-slaves' `name:` exactly - it is how the
          # endpoint poll spots a peer that has already given up.
          peer-job-name: multicomputer-slaves-debian (for ${{ matrix.platform }} master)

      # The Windows runner's Defender Firewall default-blocks inbound traffic to
      # new (unsigned) programs, so the slaves' Dob discovery/data UDP - and ICMP -
      # arriving on wg0 for safir_control is dropped even though the WireGuard
      # handshake itself succeeds (the WireGuard service installs its own allow
      # rule). The nodes never form a system and the sequencer hangs forever. This
      # is a throwaway runner, so just turn the firewall off for the run.
      - name: Open the firewall for cross-node Dob traffic (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: netsh advfirewall set allprofiles state off

      - name: Map the seed hostname to Server_1 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "${SERVER_1_ADDR} core-multicomputer-test-server-1-slave" | sudo tee -a /etc/hosts

      - name: Map the seed hostname to Server_1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path "$env:WINDIR\System32\drivers\etc\hosts" `
            -Value "$env:SERVER_1_ADDR core-multicomputer-test-server-1-slave"

      # Wait for the seed slave to be reachable before starting, so node discovery
      # doesn't race the slave containers (apt-install) coming up. Git Bash runs
      # this on Windows too; nc isn't there, so fall back to ping (OS-aware flags).
      - name: Wait for the seed slave
        shell: bash
        run: |
          set -uo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            seed_up() { ping -n 1 -w 1000 "$1" >/dev/null 2>&1; }
          else
            seed_up() { nc -z -u -w1 "$1" 30000 2>/dev/null || ping -c1 -W1 "$1" >/dev/null 2>&1; }
          fi
          echo "Waiting for the seed slave ${SERVER_1_ADDR} ..."
          for i in $(seq 1 100); do
            if seed_up "${SERVER_1_ADDR}"; then
              echo "seed reachable on attempt $i"
              exit 0
            fi
            sleep 3
          done
          # Fail fast: if the seed never comes up, run_test.py would otherwise hang
          # until the 30-min job timeout with no clear cause. Surface it here instead.
          echo "Seed slave ${SERVER_1_ADDR} never became reachable"
          exit 1

      # Same entrypoint as the standalone/multinode dose tests: run_test.py installs
      # the staged package and runs the suite. SAFIR_MULTICOMPUTER_EXTERNAL_SLAVES=1
      # tells it NOT to launch the slaves via JenkinsController - the slaves job
      # starts them as containers instead; the master still sends STOP over the
      # network (--stop-slaves). Windows invokes run_test.py via cmd, matching how
      # the standalone/multinode Windows dose tests run it.
      - name: Run multicomputer master (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          LANGUAGES: cpp-cpp-cpp-cpp-cpp
          JOB_NAME: ${{ github.workflow }}-multicomputer-master
          SAFIR_MULTICOMPUTER_EXTERNAL_SLAVES: "1"
        run: python build/jenkins_stuff/run_test.py --test multicomputer-tests

      - name: Run multicomputer master (Windows)
        if: runner.os == 'Windows'
        shell: cmd # zizmor: ignore[misfeature] - cmd is intentional here (invokes build.py the same way the Windows build does); the tip only notes cmd limits static analysis
        env:
          WORKSPACE: ${{ github.workspace }}
          LANGUAGES: cpp-cpp-cpp-cpp-cpp
          JOB_NAME: ${{ github.workflow }}-multicomputer-master
          SAFIR_MULTICOMPUTER_EXTERNAL_SLAVES: "1"
        run: python build\jenkins_stuff\run_test.py --test multicomputer-tests

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: multicomputer-results-${{ matrix.platform }}
          path: '**/*.junit.xml'
          if-no-files-found: ignore

      # The whole dose_test_output dir holds the per-process stdout/stderr and the
      # partnerN.txt results - the only place the master node's own startup output
      # lands, so it's what we need when the node never reaches production (sequencer
      # stuck in connection.Open). always() so a hung run killed by the timeout still
      # archives it.
      - name: Archive dose_test_output (master)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dose-output-master-${{ matrix.platform }}
          path: dose_test_output
          if-no-files-found: ignore

  multicomputer-slaves:
    name: multicomputer-slaves-debian (for ${{ matrix.platform }} master)
    needs: [build, dose-tests]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # See the matching comment on multicomputer-master; keep the two in step.
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # One debian slaves runner per master platform; the platform only namespaces
        # the WireGuard rendezvous so each slaves runner pairs with its own master.
        platform: [ubuntu-noble-amd64, ubuntu-noble-arm64, vs2022, vs2026]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download SDK package (debian, for slaves)
        uses: actions/download-artifact@v8
        with:
          name: packages-debian-trixie-amd64
          path: package-download

      # The workspace is mounted into the slave containers, so staging the .deb at
      # the repo root here puts it at /work for all three. deb-only: the slaves are
      # debian containers that never use a Windows .exe.
      - name: Stage installer at repo root
        uses: ./.github/actions/stage-installer
        with:
          deb-only: "true"

      - name: Establish WireGuard overlay (slaves-runner side)
        uses: ./.github/actions/wireguard-overlay
        with:
          my-role: slaves-${{ matrix.platform }}
          peer-role: master-${{ matrix.platform }}
          # Transit address on a /32; the slave nodes live on the bridge below.
          wg-address: "10.68.1.2/32"
          peer-allowed-ips: ${{ env.MASTER_ADDR }}/32
          verify-peer-ip: ${{ env.MASTER_ADDR }}
          github-token: ${{ github.token }}
          # Must match multicomputer-master's `name:` exactly - it is how the
          # endpoint poll spots a peer that has already given up.
          peer-job-name: multicomputer-master-${{ matrix.platform }}

      # Routing master <-> the three container IPs across wg0 + a docker bridge:
      # the master reaches all three containers bidirectionally at every datagram
      # size up to 60 KB. Large Dob datagrams still need FragmentSize lowered to fit
      # the wg0 MTU (see Safir.Dob.NodeParameters.dou in the multicomputer test
      # config): on this overlay anything over the tunnel MTU is kernel-IP-fragmented
      # before WireGuard encapsulates it, so a single lost fragment drops the whole
      # datagram.
      - name: Route the wg tunnel into a docker bridge for the slave nodes
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_forward=1
          # Docker's default FORWARD policy is DROP; DOCKER-USER is the supported
          # hook to let wg0 <-> bridge traffic through.
          sudo iptables -I DOCKER-USER -i wg0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o wg0 -j ACCEPT
          # Don't masquerade tunnel-bound container traffic, so the master sees the
          # real 10.68.0.x source (Docker would otherwise SNAT it to the host).
          sudo iptables -t nat -I POSTROUTING -s "${SLAVE_SUBNET}" -o wg0 -j ACCEPT
          docker network create --subnet "${SLAVE_SUBNET}" --gateway 10.68.0.254 safirnet

      # Each slave node is its own debian:13 container so it sees exactly one
      # 1*.*68.*.* address (Safir binds the first local match). The container runs
      # the SAME path the standalone/multinode dose tests use: provision the
      # harness prereqs (mirrors setup-test-env), then run_test.py, whose
      # DebianInstaller installs the staged .deb (pulling the SDK's runtime deps via
      # apt) and dispatches --slave. The slave idles in wait_for_safir_control until
      # the master sends STOP (--stop-slaves); the job ends when all three exit.
      - name: Launch the three debian slave nodes
        shell: bash
        env:
          LANGUAGES: cpp-cpp-cpp-cpp-cpp
        run: |
          set -euo pipefail
          start_slave() {
            local name="$1" ip="$2" role="$3"
            # Give each slave its OWN /work mount instead of sharing one across all
            # three containers, so each harness run's .venv / dose_test_output /
            # temp area is naturally isolated.
            rm -rf "run-$role"
            mkdir -p "run-$role"
            cp -a build "run-$role/build"
            cp -a ./*.deb "run-$role/"
            docker run -d --name "$name" --network safirnet --ip "$ip" \
              --add-host "core-multicomputer-test-server-1-slave:${SERVER_1_ADDR}" \
              --shm-size=2g \
              -e LANGUAGES="$LANGUAGES" -e JOB_NAME="multicomputer-$role" \
              -v "$PWD/run-$role":/work -w /work debian:13 \
              bash -c "set -e
                apt-get update -qq
                apt-get install -y --no-install-recommends \
                  sudo ca-certificates git iputils-ping netcat-openbsd \
                  python3 python3-venv python3-pip python-is-python3 python3-distro python3-apt python3-websocket
                git config --global --add safe.directory '*'
                echo \"=== [$role] reachability probe to master ${MASTER_ADDR} ===\"
                if ping -c3 -W2 ${MASTER_ADDR}; then
                  echo \"PROBE [$role]: ICMP to master ${MASTER_ADDR} PASS\"
                else
                  echo \"PROBE [$role]: ICMP to master ${MASTER_ADDR} FAIL\"
                fi
                python3 -m venv --system-site-packages .venv
                . .venv/bin/activate
                python -m pip install --quiet --upgrade pip
                pip install --quiet -r build/requirements.txt
                export WORKSPACE=/work
                python build/jenkins_stuff/run_test.py --slave $role"
          }
          start_slave server-1 "${SERVER_1_ADDR}" server-1
          start_slave client-0 "${CLIENT_0_ADDR}" client-0
          start_slave client-1 "${CLIENT_1_ADDR}" client-1

      - name: Stream slave output and wait for the containers to exit
        shell: bash
        # GHA shows one live log stream per job and runs steps sequentially, so we
        # follow all three containers concurrently with a [name] prefix, then dump
        # each full log in a collapsible group. The master drives shutdown over the
        # network via --stop-slaves; a clean slave shutdown exits 0, so a non-zero
        # container exit code means that slave crashed - fail the job so it shows red.
        run: |
          set -uo pipefail
          pids=()
          for name in server-1 client-0 client-1; do
            ( docker logs -f "$name" 2>&1 | sed -u "s/^/[$name] /" ) &
            pids+=("$!")
          done
          docker wait server-1 client-0 client-1 || true
          sleep 2
          kill "${pids[@]}" 2>/dev/null || true
          echo ""
          for name in server-1 client-0 client-1; do
            echo "::group::$name full log"
            docker logs "$name" 2>&1
            echo "::endgroup::"
          done
          rc=0
          for name in server-1 client-0 client-1; do
            code="$(docker inspect -f '{{.State.ExitCode}}' "$name" 2>/dev/null || echo 1)"
            echo "slave $name exited with code $code"
            if [ "$code" != "0" ]; then rc=1; fi
          done
          exit "$rc"

      # Each slave wrote its output to its own run-<role>/dose_test_output (its
      # private /work mount). Those files are owned by the container's root user on
      # the bind mount, so relax perms before the runner user uploads them.
      - name: Archive dose_test_output (slaves)
        if: always()
        shell: bash
        run: sudo chmod -R a+rX run-* 2>/dev/null || true

      - name: Upload dose_test_output (slaves)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dose-output-slaves-${{ matrix.platform }}
          path: run-*/dose_test_output
          if-no-files-found: ignore

  # Aggregate every test job's junit results into one report. The build,
  # dose-tests and slow-tests jobs each upload their *.junit.xml as artifacts;
  # this job pulls them all and publishes a single Check run + run-summary page +
  # PR comment, so the pass/fail status of all ~35 test jobs - and the details of
  # any failure - are visible from one place instead of clicking each job's own
  # report. Runs on always() so it still reports when some test job failed.
  test-summary:
    name: Test summary
    needs: [build, dose-tests, slow-tests, multicomputer-master, multicomputer-slaves]
    if: always()
    runs-on: ubuntu-latest
    # checks: write to create the Check run; pull-requests: write so the action
    # can post/update the summary comment on PRs (the workflow-level grant omits
    # it, and a job-level permissions block replaces rather than extends it).
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Download all test result artifacts
        uses: actions/download-artifact@v8
        with:
          # Matches the build job's test-results-* and the dose-tests job's
          # dose-results-* artifacts while skipping packages-*/buildlog-*. Each
          # artifact lands in its own subdir under artifacts/ (no merge-multiple)
          # so identical relative junit paths from different platforms don't
          # overwrite each other.
          pattern: '*results-*'
          path: artifacts

      - name: Publish consolidated test report
        # Pinned to a commit SHA (zizmor unpinned-uses): this is the one
        # third-party action in the workflow, so it carries real supply-chain
        # risk if its tag were repointed. First-party actions/* are left on
        # floating major tags (allowed via .github/zizmor.yml). SHA is v2.24.0;
        # bump both together.
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: Test results
          files: artifacts/**/*.junit.xml
          # Signalling model - two separate binary signals:
          #  - The build/dose-tests JOBS answer "did it build and run?". They go
          #    red ONLY on a real error (build break, crash, hang, setup
          #    failure). A plain test failure does NOT fail those jobs: build.py
          #    runs ctest with allow_fail and returns 0, and run_dose_tests
          #    returns 0 on testcase diffs - a failure lands only in the junit.
          #  - This "Test results" check answers "did the tests pass?". fail_on
          #    'test failures' (the action's default, set explicitly here for
          #    intent) turns the check red whenever any test fails or errors, and
          #    green when all pass.
          # action_fail false keeps the test-summary job itself green: the job is
          # not a test runner, so the red belongs on the check, not on the job.
          fail_on: test failures
          action_fail: false

  # Collect the compiler/cmake/doxygen/lintian warnings from every build and
  # publish one consolidated "Build warnings" Check with source-linked
  # annotations - the GitHub-Actions replacement for Jenkins' warnings-ng
  # analysis (archive_and_analyze in the Jenkinsfile). Each build/examples/docs
  # job uploads its log as a buildlog-* artifact; buildlog_to_text.py unwraps it
  # and DROPS warnings from Conan dependency builds (only our own tree's
  # diagnostics survive), and lintian_to_sarif.py extracts the .deb packaging
  # warnings (Quality Monitor has no lintian parser). Runs on always() so it
  # reports even when a build failed. Summary-only: no quality-gates are set, so
  # the Check shows the warnings but the job stays green (GitHub has no
  # "unstable" state, and this matches test-summary's action_fail:false model).
  warnings-summary:
    name: Warnings summary
    needs: [build, build-examples, render-docs]
    if: always()
    runs-on: ubuntu-latest
    # checks: write to publish the Check; pull-requests: write for the PR comment
    # (a job-level block replaces, not extends, the workflow grant).
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The buildlog/packaging parsers below have no CMake/CTest coverage (they
      # are CI tooling, not shippable code), so guard them with their own unit
      # tests here before we trust their output.
      - name: Test the warnings parsers
        run: python -m unittest discover -s build -p 'test_*.py' -v

      - name: Download all build-log artifacts
        uses: actions/download-artifact@v8
        with:
          # buildlog-<platform>-<arch> (SDK build), buildlog-examples-* and
          # buildlog-docs. Each lands in its own subdir under buildlogs/.
          pattern: 'buildlog-*'
          path: buildlogs

      - name: Extract our-code warnings from the build logs
        run: |
          set -euo pipefail
          # buildlogs/<artifact>/buildlog.{html,txt} -> buildlogs/<artifact>.log,
          # Conan-dependency warnings stripped, our paths made repo-relative.
          python build/buildlog_to_text.py --root buildlogs
          # The .deb packaging warnings (lintian + dpkg/dh) have no analysis-model
          # parser, so convert them to SARIF.
          python build/packaging_to_sarif.py --root buildlogs -o buildlogs/packaging.sarif

      - name: Detect pull request
        id: pr
        uses: jwalton/gh-find-current-pr@f3d61b485d2801773f7a07b2aaa3306bd8f8e653 # v1.3.5

      - name: Publish build-warnings summary
        uses: uhafner/quality-monitor@0100da6973a1498aad89af676852a8c788d397f8 # v4.15.0
        with:
          checks-name: Build warnings
          pr-number: ${{ steps.pr.outputs.number }}
          # Patterns MUST be **/-prefixed: Quality Monitor resolves them as
          # recursive globs and a bare "buildlogs/*.log" matches nothing.
          # No quality-gates key => warnings are reported but never fail the job.
          config: |
            {
              "analysis": [
                {
                  "name": "Build warnings",
                  "id": "warnings",
                  "tools": [
                    { "id": "gcc",     "pattern": "**/buildlog-*.log" },
                    { "id": "msbuild", "pattern": "**/buildlog-*.log" },
                    { "id": "java",    "pattern": "**/buildlog-*.log" },
                    { "id": "doxygen", "pattern": "**/buildlog-*.log" },
                    { "id": "cmake",   "pattern": "**/buildlog-*.log" },
                    { "id": "sarif",   "name": "Packaging", "pattern": "**/packaging.sarif" }
                  ]
                }
              ]
            }

  # On a version-tag push, create a DRAFT GitHub release with the distributable
  # installers the build job produced: the Windows .exe installers as-is, and the
  # Linux .deb sets bundled one .tar.bz2 per platform+arch (named like the manual
  # releases: safir-sdk-core_<ver>_<arch>-<distro>.debs.tar.bz2). Test-result and
  # build-log artifacts are deliberately left off the release. Depends only on
  # build (not the test jobs), so the release is cut from the build output as
  # soon as packaging succeeds; change `needs` if you want test gating.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The workflow-level grant is contents: read; a job-level block replaces it,
    # so re-grant read and add write so gh can create the release and upload assets.
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        # Pull every per-platform packages-* artifact (skipping buildlog-*/
        # *results-*). Each lands in its own subdir under dist/, preserving the
        # tmp/ (.deb) and build/packaging/windows/ (.exe) paths from the upload.
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          assets_dir="$PWD/release-assets"
          for dir in dist/packages-*; do
            [ -d "$dir" ] || continue
            # The artifact name is packages-<platform>-<arch>; the distro is the
            # platform part (everything before the trailing -<arch>).
            label="${dir#dist/packages-}"
            distro="${label%-*}"
            # Bundle this Linux build's .deb set into one bzip2 tarball, matching
            # the manual releases' naming: safir-sdk-core_<ver>_<arch>-<distro>.debs.tar.bz2.
            # Version and arch are read from a .deb filename (<pkg>_<ver>_<arch>.deb)
            # so they reflect what was actually built (e.g. 7.4.3~alpha1-1, amd64).
            mapfile -t debs < <(find "$dir" -type f -name '*.deb' | sort)
            if [ "${#debs[@]}" -gt 0 ]; then
              base="$(basename "${debs[0]}")"
              ver="$(echo "$base" | awk -F'_' '{print $(NF-1)}')"
              arch="${base##*_}"; arch="${arch%.deb}"
              # The .deb version is <upstream>-<debian-revision> (e.g.
              # 7.4.3~alpha1-1). Drop the trailing debian revision; the manual
              # releases never carried it in the asset name.
              ver="${ver%-*}"
              # The .deb files keep the tilde (debian needs it for version
              # ordering), but the dash is the canonical form everywhere else,
              # so translate it back for the outer tarball's asset name
              # (e.g. 7.4.3~alpha1 -> 7.4.3-alpha1).
              ver="${ver//\~/-}"
              debdir="$(dirname "${debs[0]}")"
              # tar from inside debdir so the archive holds just the .deb files
              # (no tmp/ wrapper); -f path is absolute so the cd doesn't break it.
              ( cd "$debdir" && tar -cjf \
                  "$assets_dir/safir-sdk-core_${ver}_${arch}-${distro}.debs.tar.bz2" ./*.deb )
            fi
            # Windows installers already carry the canonical dash version (no
            # tilde to translate). Their filenames include the version and VS
            # year, so vs2022/vs2026 never collide.
            while IFS= read -r exe; do
              cp "$exe" "release-assets/$(basename "$exe")"
            done < <(find "$dir" -type f -name '*.exe')
          done
          echo "Release assets:"
          ls -la release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Pre-release for alpha/beta tags (those carry a -suffix); a bare
          # MAJOR.MINOR.PATCH tag publishes as a normal release.
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # --repo is required: this job has no checkout, so gh cannot infer the
          # repository from a local git remote (it errors "not a git repository").
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release already exists (e.g. a re-run): just (re)upload the assets.
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Create as a draft so publishing is a deliberate manual step in the
            # GitHub UI after the assets/notes have been reviewed.
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Safir SDK Core ${TAG}" \
              --generate-notes \
              "${prerelease[@]}"
          fi
