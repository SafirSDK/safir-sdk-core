name: CI

on:
  push:
    branches: [master, develop, 'feature/**', 'private/**']
  pull_request:
  workflow_dispatch:

env:
  SAFIR_SKIP_SLOW_TESTS: "1"

# checks: write lets the test-reporter publish a Check run with the results.
permissions:
  contents: read
  checks: write

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    # Most rows run directly on the host runner. The Debian row sets
    # matrix.container to a Debian image so the build runs against Debian's real
    # toolchain/libs; an empty image here means "no container" (run on host).
    # GitHub has no Debian-labelled runner, so a container on ubuntu-latest is
    # the only way to get a genuine Debian build. The object form is needed so we
    # can pass --shm-size: Docker defaults /dev/shm to 64 MB, but dose_main
    # creates a 100 MB managed_shared_memory there and quick_exit(1)s if it can't,
    # which fails every test that starts the DOB.
    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options }}

    # Keep the Conan cache (and thus the from-scratch Boost/Qt builds) off the
    # cramped Windows C: drive. The hosted Windows runners only have ~32-85 GB
    # free on C: but a near-empty 147 GB D: "Temporary Storage" drive, where the
    # workspace already lives. Linux keeps the default ~/.conan2.
    env:
      CONAN_HOME: ${{ matrix.conan_home }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-noble
            arch: amd64
            runner: ubuntu-24.04
            conan_home: /home/runner/.conan2

          # Native arm64 build on GitHub's hosted Arm runner. The Linux build
          # steps are arch-agnostic (keyed on runner.os), so no other changes are
          # needed; the Conan cache key already includes runner.arch so amd64 and
          # arm64 caches stay separate.
          - platform: ubuntu-noble
            arch: arm64
            runner: ubuntu-24.04-arm
            conan_home: /home/runner/.conan2

          # No Debian runner exists, so build inside a Debian container on the
          # ubuntu-latest host. Runs as root (the container's default user):
          # writes to $GITHUB_ENV/$GITHUB_PATH and the mounted workspace all work
          # without UID juggling, and root-owned files are correct for a system
          # .deb anyway (lintian's root-owner warnings are cosmetic). CONAN_HOME
          # is /root/.conan2 because there is no /home/runner inside the container.
          - platform: debian-trixie
            arch: amd64
            runner: ubuntu-latest
            container: debian:13
            container_options: --shm-size=200m
            conan_home: /root/.conan2

          - platform: vs2022
            arch: amd64
            runner: windows-2022
            studio: vs2022
            conan_home: 'D:\.conan2'

          - platform: vs2026
            arch: amd64
            runner: windows-2025-vs2026
            studio: vs2026
            conan_home: 'D:\.conan2'

    steps:
      - name: Bootstrap Debian container
        # The debian:13 image is bare: no git (actions/checkout needs it to
        # produce a real working tree, otherwise build scripts that call git
        # break), no sudo (the shared "Install Linux prerequisites" step calls
        # sudo apt-get), and no ca-certificates (https apt/pip would fail). Run
        # this before checkout so the repo is cloned with git. Skipped on
        # non-container rows where matrix.container is empty.
        if: ${{ matrix.container != '' }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo ca-certificates git
          # The workspace is mounted owned by the host runner UID (1001) but we
          # run as root, so git refuses with "dubious ownership". checkout works
          # around this for itself, but build.py's own git calls would still
          # fail; mark all repos safe globally for root.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5

      # Toolchains, Python venv and Conan cache. Shared with the build-examples
      # job via a composite action so the two setups cannot drift apart.
      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          platform: ${{ matrix.platform }}
          conan-home: ${{ matrix.conan_home }}

      - name: Check source tree
        run: python build/check_source_tree.py

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: python build/build.py --jenkins

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python build\build.py --jenkins --use-studio ${{ matrix.studio }} --arch amd64

      - name: Trim Conan cache before saving
        # Conan keeps each dependency's source/build/download folders next to the
        # final package binary under ~/.conan2/p/b/<ref>/. Only the package binary
        # is needed on restore; the rest (huge for source-built Boost/Qt) just eats
        # runner disk. The --lru prune also drops package binaries not used in this
        # build (e.g. an old Qt version left behind after a conanfile bump), so the
        # cache doesn't accumulate every version ever built. Conan refreshes the
        # last-used time of everything it resolves, so the current deps are kept.
        # Run always so a failed build still saves a lean cache.
        if: always()
        shell: bash
        run: |
          conan remove "*" --lru=1d --confirm || true
          conan cache clean "*" || true

      - name: Upload packages
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            tmp/*.deb
            build/packaging/windows/*.exe
          if-no-files-found: ignore

      - name: Upload build log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: buildlog-${{ matrix.platform }}-${{ matrix.arch }}
          path: buildlog.html
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: '**/*.junit.xml'
          if-no-files-found: ignore

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: tests-${{ matrix.platform }}-${{ matrix.arch }}
          path: '**/*.junit.xml'
          reporter: java-junit
          # The build step already fails the job on test failures; keep this
          # step from erroring (e.g. on fork PRs without checks: write) so it
          # never masks the real result.
          fail-on-error: false

  # Build the example apps against the SDK package the build job produced. This
  # mirrors the Jenkins "Build examples" stage: it installs the package
  # system-wide and uses dobmake-batch (via run_test.py) to compile the example
  # apps on top of the installed SDK - the real-world check that a user can build
  # against an installed Safir SDK Core. On Windows that includes Debug apps,
  # where the MSVC per-config runtime split matters.
  build-examples:
    name: examples-${{ matrix.platform }}-${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}

    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options }}

    env:
      CONAN_HOME: ${{ matrix.conan_home }}
      # examples/CMakeLists.txt switches VehicleAppCpp to an old Conan Boost 1.79
      # when JENKINS_HOME is set, exactly like the Jenkins examples build - this
      # verifies the SDK works against a user-chosen Boost. run_test.py itself
      # does not read this variable, so it has no other effect.
      JENKINS_HOME: "1"
      # run_test.py's build_examples() forwards these to dobmake-batch on Windows
      # (--use-studio / --arch). PACKAGE_TYPE is left unset and defaults to Full,
      # so the examples are built in Debug + Release + RelWithDebInfo.
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_ARCH: ${{ matrix.arch }}

    # Same matrix as the build job (kept in sync by hand); each row consumes the
    # package artifact uploaded by its build-job counterpart.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-noble
            arch: amd64
            runner: ubuntu-24.04
            conan_home: /home/runner/.conan2

          # Native arm64 build on GitHub's hosted Arm runner, matching the build
          # job. The examples build is arch-agnostic (keyed on runner.os) and the
          # Conan cache key includes runner.arch, so amd64 and arm64 stay separate.
          - platform: ubuntu-noble
            arch: arm64
            runner: ubuntu-24.04-arm
            conan_home: /home/runner/.conan2

          - platform: debian-trixie
            arch: amd64
            runner: ubuntu-latest
            container: debian:13
            container_options: --shm-size=200m
            conan_home: /root/.conan2

          - platform: vs2022
            arch: amd64
            runner: windows-2022
            studio: vs2022
            conan_home: 'D:\.conan2'

          - platform: vs2026
            arch: amd64
            runner: windows-2025-vs2026
            studio: vs2026
            conan_home: 'D:\.conan2'

    steps:
      - name: Bootstrap Debian container
        # Same as the build job: the bare debian:13 image needs git/sudo/ca-certs
        # before checkout and before the shared setup runs sudo apt-get.
        if: ${{ matrix.container != '' }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo ca-certificates git
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          platform: ${{ matrix.platform }}
          conan-home: ${{ matrix.conan_home }}
          # Separate cache from the SDK build: the examples only pull a small
          # Boost 1.79, so they must not share (or evict) the SDK's Qt/Boost cache.
          conan-cache-prefix: conan-examples-v1
          # The examples build only compiles apps against the installed SDK; it
          # never renders docs or builds packages, so skip that toolchain (and
          # the flaky asciidoctorj choco install) entirely.
          docs-and-packaging: "false"

      - name: Download SDK package
        # v8 runs on Node 24; the v6 tag still bundles Node 20, which GitHub is
        # deprecating. v8 reads artifacts produced by upload-artifact v4+, so it
        # is compatible with the v6 upload step in the build job.
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: package-download

      - name: Stage installer at repo root
        # run_test.py globs the installer in the working directory (the repo root:
        # safir-sdk-core_*.deb on Linux, SafirSDKCore*.exe on Windows). The
        # artifact preserves the original tmp/ and build/packaging/windows/ paths,
        # so the package lands somewhere under package-download/ rather than at its
        # root - find it wherever it is and move it up.
        shell: bash
        run: |
          echo "Downloaded artifact contents:"
          find package-download -type f
          find package-download -type f \( -name '*.deb' -o -name '*.exe' \) -exec mv {} . \;
          echo "Repo root after staging:"
          ls -la safir-sdk-core_*.deb SafirSDKCore*.exe 2>/dev/null || true

      - name: Build examples (Linux)
        if: runner.os == 'Linux'
        run: python build/jenkins_stuff/run_test.py --test build-examples

      - name: Build examples (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python build\jenkins_stuff\run_test.py --test build-examples

      - name: Trim Conan cache before saving
        # Same hygiene as the build job: drop source/build/download folders and
        # stale package binaries so the saved cache stays lean. Run always so a
        # failed build still saves a clean cache.
        if: always()
        shell: bash
        run: |
          conan remove "*" --lru=1d --confirm || true
          conan cache clean "*" || true

  # Run the big dose test suite (243 testcases) against the installed SDK package,
  # in both the "standalone" (one node) and "multinode" (four nodes, all on this
  # one machine) configurations. This mirrors the Jenkins "Test suite" stage. The
  # flow matches build-examples: install the testsuite package via run_test.py,
  # which then drives run_dose_tests with the partner languages from $LANGUAGES.
  # The multicomputer config is intentionally NOT run here - it needs separate
  # slave *machines* (Jenkins agents), which hosted GitHub runners can't provide.
  dose-tests:
    name: ${{ matrix.kind }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.languages }}
    needs: build
    runs-on: ${{ matrix.runner }}
    # A dose run that hangs (e.g. a partner that never connects) would otherwise
    # sit until the 6-hour default. 30 min is comfortably above an observed
    # healthy run; revisit once we have more timing data.
    timeout-minutes: 30

    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options }}

    env:
      # run_test.py passes --jenkins to run_dose_tests, which then reads the
      # partner-language assignment from $LANGUAGES (5 dash-separated languages,
      # one per partner). This is what makes each matrix row a distinct
      # cross-language interop run.
      LANGUAGES: ${{ matrix.languages }}
      # run_dose_tests --jenkins puts its temp area (lock files, crash dumps) at
      # $WORKSPACE/temp; on Jenkins WORKSPACE is the build workspace. github.workspace
      # is the GHA equivalent, so reuse it. Safir creates the subdirs itself.
      WORKSPACE: ${{ github.workspace }}
      # run_test.py's run_test_suite() reads $JOB_NAME to detect 32-bit-on-64
      # ("32on64") Jenkins jobs and drop the Java partner. We are never that, so
      # any value without "32on64" both satisfies the lookup (it would KeyError if
      # unset) and keeps all partners enabled.
      JOB_NAME: ${{ github.workflow }}-${{ matrix.kind }}

    # kind x languages x platform = 2 x 3 x 5 = 30 jobs. kind/languages/platform
    # are real cross-product axes; the include entries only attach the coupled
    # per-platform settings (runner, container, conan_home) to each platform token,
    # so the five build rows stay defined in one place instead of 30 duplicates.
    strategy:
      fail-fast: false
      matrix:
        kind: [standalone, multinode]
        languages:
          - dotnet-java-cpp-dotnet-java
          - java-cpp-dotnet-java-cpp
          - cpp-cpp-cpp-cpp-cpp
        platform: [ubuntu-noble-amd64, ubuntu-noble-arm64, debian-trixie-amd64, vs2022, vs2026]
        include:
          - platform: ubuntu-noble-amd64
            platform_name: ubuntu-noble
            arch: amd64
            runner: ubuntu-24.04
          - platform: ubuntu-noble-arm64
            platform_name: ubuntu-noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: debian-trixie-amd64
            platform_name: debian-trixie
            arch: amd64
            runner: ubuntu-latest
            container: debian:13
            # The multinode tests run four safir_control nodes at once, each
            # with its own shared memory in /dev/shm: ~100 MB Dob distribution
            # (SharedMemorySize) + 10 MB typesystem per node, so ~440 MB total.
            # 200m fits a single node (standalone passes) but not four, so the
            # extra nodes fail to map their shared memory, the system never
            # forms and the sequencer hangs until the timeout. Native runners
            # have a large /dev/shm; give the container comparable headroom
            # (tmpfs only consumes what is actually used).
            container_options: --shm-size=2g
          - platform: vs2022
            platform_name: vs2022
            arch: amd64
            runner: windows-2022
          - platform: vs2026
            platform_name: vs2026
            arch: amd64
            runner: windows-2025-vs2026

    steps:
      - name: Bootstrap Debian container
        # Same as the build job: the bare debian:13 image needs git/sudo/ca-certs
        # before checkout and before the shared setup runs sudo apt-get.
        if: ${{ matrix.container != '' }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo ca-certificates git
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5

      - name: Set up test environment
        # The dose tests only install a prebuilt package and run it; they never
        # compile or invoke Conan. setup-test-env installs just the Python venv
        # and a JRE, skipping the compilers, Qt/Boost -dev packages, doc
        # toolchain and Conan cache that setup-build-env carries.
        uses: ./.github/actions/setup-test-env

      - name: Download SDK package
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.platform_name }}-${{ matrix.arch }}
          path: package-download

      - name: Stage installer at repo root
        # Identical to build-examples: run_test.py globs the installer from the
        # repo root, but the artifact preserves the tmp/ and packaging paths, so
        # move whatever .deb/.exe it contains up to the root.
        shell: bash
        run: |
          echo "Downloaded artifact contents:"
          find package-download -type f
          find package-download -type f \( -name '*.deb' -o -name '*.exe' \) -exec mv {} . \;
          echo "Repo root after staging:"
          ls -la safir-sdk-core_*.deb SafirSDKCore*.exe 2>/dev/null || true

      - name: Run dose tests (Linux)
        if: runner.os == 'Linux'
        run: python build/jenkins_stuff/run_test.py --test ${{ matrix.kind }}-tests

      - name: Run dose tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python build\jenkins_stuff\run_test.py --test ${{ matrix.kind }}-tests

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dose-results-${{ matrix.kind }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.languages }}
          path: '**/*.junit.xml'
          if-no-files-found: ignore

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: dose-${{ matrix.kind }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.languages }}
          path: '**/*.junit.xml'
          reporter: java-junit
          # run_test.py already fails the job on test failures; don't let the
          # reporter error mask the real result.
          fail-on-error: false
