name: CI

on:
  push:
    branches: [master, develop, 'feature/**', 'private/**']
  pull_request:
  workflow_dispatch:

env:
  SAFIR_SKIP_SLOW_TESTS: "1"

# checks: write lets the test-reporter publish a Check run with the results.
permissions:
  contents: read
  checks: write

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    # Most rows run directly on the host runner. The Debian row sets
    # matrix.container to a Debian image so the build runs against Debian's real
    # toolchain/libs; an empty image here means "no container" (run on host).
    # GitHub has no Debian-labelled runner, so a container on ubuntu-latest is
    # the only way to get a genuine Debian build. The object form is needed so we
    # can pass --shm-size: Docker defaults /dev/shm to 64 MB, but dose_main
    # creates a 100 MB managed_shared_memory there and quick_exit(1)s if it can't,
    # which fails every test that starts the DOB.
    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options }}

    # Keep the Conan cache (and thus the from-scratch Boost/Qt builds) off the
    # cramped Windows C: drive. The hosted Windows runners only have ~32-85 GB
    # free on C: but a near-empty 147 GB D: "Temporary Storage" drive, where the
    # workspace already lives. Linux keeps the default ~/.conan2.
    env:
      CONAN_HOME: ${{ matrix.conan_home }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-noble
            arch: amd64
            runner: ubuntu-24.04
            conan_home: /home/runner/.conan2

          # Native arm64 build on GitHub's hosted Arm runner. The Linux build
          # steps are arch-agnostic (keyed on runner.os), so no other changes are
          # needed; the Conan cache key already includes runner.arch so amd64 and
          # arm64 caches stay separate.
          - platform: ubuntu-noble
            arch: arm64
            runner: ubuntu-24.04-arm
            conan_home: /home/runner/.conan2

          # No Debian runner exists, so build inside a Debian container on the
          # ubuntu-latest host. Runs as root (the container's default user):
          # writes to $GITHUB_ENV/$GITHUB_PATH and the mounted workspace all work
          # without UID juggling, and root-owned files are correct for a system
          # .deb anyway (lintian's root-owner warnings are cosmetic). CONAN_HOME
          # is /root/.conan2 because there is no /home/runner inside the container.
          - platform: debian-trixie
            arch: amd64
            runner: ubuntu-latest
            container: debian:13
            container_options: --shm-size=200m
            conan_home: /root/.conan2

          - platform: vs2022
            arch: amd64
            runner: windows-2022
            studio: vs2022
            conan_home: 'D:\.conan2'

          - platform: vs2026
            arch: amd64
            runner: windows-2025-vs2026
            studio: vs2026
            conan_home: 'D:\.conan2'

    steps:
      - name: Bootstrap Debian container
        # The debian:13 image is bare: no git (actions/checkout needs it to
        # produce a real working tree, otherwise build scripts that call git
        # break), no sudo (the shared "Install Linux prerequisites" step calls
        # sudo apt-get), and no ca-certificates (https apt/pip would fail). Run
        # this before checkout so the repo is cloned with git. Skipped on
        # non-container rows where matrix.container is empty.
        if: ${{ matrix.container != '' }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo ca-certificates git
          # The workspace is mounted owned by the host runner UID (1001) but we
          # run as root, so git refuses with "dubious ownership". checkout works
          # around this for itself, but build.py's own git calls would still
          # fail; mark all repos safe globally for root.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5

      - name: "Verify D: drive exists (Windows)"
        # CI puts CONAN_HOME on D:\.conan2 because the C: drive is too small for
        # the from-scratch Boost/Qt builds. If the runner image ever drops the D:
        # "Temporary Storage" drive, fail loudly here instead of with a confusing
        # out-of-disk error mid-build.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'D:\')) {
            Write-Error "D: drive not found. CI relies on it for CONAN_HOME ($env:CONAN_HOME) because C: is too small for the Boost/Qt builds. The runner image likely changed - revisit the conan_home matrix value in this workflow."
            exit 1
          }
          Write-Host "D: drive present; CONAN_HOME=$env:CONAN_HOME"

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip pipx python-is-python3 python3-distro \
            build-essential g++ cmake \
            default-jdk \
            libboost-all-dev unixodbc-dev \
            doxygen graphviz \
            qt6-base-dev qt6-websockets-dev qt6-base-private-dev qt6-svg-dev \
            dia dblatex texlive-font-utils ghostscript \
            devscripts debhelper fakeroot \
            ninja-build python3-websocket \
            asciidoctor cli-common-dev

      - name: Install Windows prerequisites
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # doxygen/graphviz/asciidoctorj/dia render the documentation that the
          # Windows packages must ship (see BUILD.Windows.txt); without them the
          # build silently skips docs. dejavufonts/gzip back the doc generation.
          # asciidoctorj is the JVM asciidoctor and needs Java at build time - the
          # "Set up Java (Windows)" step below puts it on PATH before the build.
          choco install nsis doxygen.install graphviz asciidoctorj dia dejavufonts gzip --no-progress -y
          # choco installs NSIS but does not put it on PATH. windows-2022 shipped
          # NSIS on PATH already; windows-2025-vs2026 does not, so makensis was not
          # found during packaging. Add it explicitly for the later build step.
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Set up Java (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python venv
        shell: bash
        run: |
          python -m venv --system-site-packages .venv
          # Export VIRTUAL_ENV (not just PATH) so CMake's find_package(Python3)
          # selects the venv interpreter. Without it, FindPython3 on Windows
          # prefers the registry/system Python and the ctest scripts run with an
          # interpreter that lacks our pip requirements (e.g. websockets).
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> $GITHUB_PATH
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          fi

      - name: Install Python requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r build/requirements.txt

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ${{ matrix.conan_home }}
          key: conan-v2-${{ matrix.platform }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'build/requirements.txt') }}
          restore-keys: |
            conan-v2-${{ matrix.platform }}-${{ runner.arch }}-

      - name: Trim Conan cache after restore
        # The restored cache may carry each dependency's source/build/download
        # folders (~/.conan2/p/b/<ref>/{s,b,d}) alongside the package binary (p/).
        # Those are huge for source-built Boost/Qt and only waste runner disk
        # during the build. Drop them now so the build has room. Safe: conan
        # consumes the cached package binaries without these folders.
        shell: bash
        run: conan cache clean "*" || true

      - name: Check source tree
        run: python build/check_source_tree.py

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: python build/build.py --jenkins

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python build\build.py --jenkins --use-studio ${{ matrix.studio }} --arch amd64

      - name: Trim Conan cache before saving
        # Conan keeps each dependency's source/build/download folders next to the
        # final package binary under ~/.conan2/p/b/<ref>/. Only the package binary
        # is needed on restore; the rest (huge for source-built Boost/Qt) just eats
        # runner disk. The --lru prune also drops package binaries not used in this
        # build (e.g. an old Qt version left behind after a conanfile bump), so the
        # cache doesn't accumulate every version ever built. Conan refreshes the
        # last-used time of everything it resolves, so the current deps are kept.
        # Run always so a failed build still saves a lean cache.
        if: always()
        shell: bash
        run: |
          conan remove "*" --lru=1d --confirm || true
          conan cache clean "*" || true

      - name: Upload packages
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            tmp/*.deb
            build/packaging/windows/*.exe
          if-no-files-found: ignore

      - name: Upload build log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: buildlog-${{ matrix.platform }}-${{ matrix.arch }}
          path: buildlog.html
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: '**/*.junit.xml'
          if-no-files-found: ignore

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: tests-${{ matrix.platform }}-${{ matrix.arch }}
          path: '**/*.junit.xml'
          reporter: java-junit
          # The build step already fails the job on test failures; keep this
          # step from erroring (e.g. on fork PRs without checks: write) so it
          # never masks the real result.
          fail-on-error: false
